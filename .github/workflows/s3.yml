name: Subir Proyecto Bucket S3
on:
  workflow_dispatch:

jobs:
  despliegue-bucket:
    runs-on: ubuntu-latest
    steps:
      - name: 1.Checkout del código
        uses: actions/checkout@v6-beta

      - name: 2.Configurar Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: '18'

      - name: 3.Instalar dependencias
        run: |
          npm install
      - name: 4.Configurar credenciales de AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Credenciales configuradas"


      - name: 5.Subir al bucket
        run: |
          echo "Subiendo archivos a S3..."
          aws s3 sync ./src/ "s3://${{ secrets.S3_BUCKET }}/" --delete