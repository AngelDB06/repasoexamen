name: Despliegue a S3

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy 'src' folder to S3 Bucket
        run: |
          # Sincroniza la carpeta local 'src/' con el destino S3.
          # La expresión ${{ secrets.S3_BUCKET_NAME }} inyecta el nombre del bucket directamente.
          aws s3 sync src/ s3://${{ secrets.S3_BUCKET_NAME }} --delete       