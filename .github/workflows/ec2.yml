name: Desplegar en EC2

on:
  workflow_dispatch:

jobs:
  despliegue_ec2:
    runs-on: ubuntu-latest
    steps:
      - name: 1.Checkout del código
        uses: actions/checkout@v6-beta

      - name: 2. Copiar archivos a isntancia
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "./src"
          target: "/home/${{ secrets.EC2_USER }}/site"   

      - name: Move files to web dir and restart nginx
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            sudo mkdir -p /var/www/my-site
            sudo rm -rf /usr/share/nginx/html/*
            echo "Directorio de Nginx limpiado."
          
            sudo cp -r /home/${{ secrets.EC2_USER }}/site/. /usr/share/nginx/html/
            echo "Contenido de 'src' movido a Nginx."