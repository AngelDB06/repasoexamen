
name: Desplegar en EC2

on:
  workflow_dispatch:

jobs:
  despliegue_ec2:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Copiar contenido de 'src' a carpeta temporal
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "./src/."
          target: "/home/${{ secrets.EC2_USER }}/tmp_deploy"


      - name: 3. Limpiar, Mover y Recargar Nginx
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |

            sudo mkdir -p /usr/share/nginx/html
            sudo chmod -R 755 /usr/share/nginx/html


            sudo rm -rf /usr/share/nginx/html/*
            echo "Directorio de Nginx limpiado."


            sudo cp -a /home/${{ secrets.EC2_USER }}/tmp_deploy/src/. /usr/share/nginx/html/
            echo "Contenido de 'src' movido directamente a la raíz de Nginx."

            sudo rm -rf /home/${{ secrets.EC2_USER }}/tmp_deploy
            echo "Carpeta temporal eliminada."

            sudo systemctl reload nginx
            echo "Nginx recargado."
