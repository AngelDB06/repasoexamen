name: CI

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - "release"

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install && npm install jest jsdoc --no-save

      - name: Run tests
        run: npm test

  docs:
    name: Generate and Deploy Documentation
    runs-on: ubuntu-latest
    needs: test 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAGES_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JSDoc
        run: npm install jsdoc --no-save

      - name: Generate Documentation
        run: npm run docs

      - name: Deploy docs to gh-pages (create branch if missing)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_PAT || secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

  pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: docs
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Check current Pages site status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GET /repos/${GITHUB_REPOSITORY}/pages ->"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true
          echo
          echo "HTTP status code above (404 means no site configured)."

      - name: Ensure Pages site exists (create if missing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
        run: |
          TOKEN=${PAGES_PAT:-$GITHUB_TOKEN}
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)
          echo "Current Pages status: $STATUS"
          if [ "$STATUS" = "404" ]; then
            echo "Pages site not found. Attempting to create using token..."
            CREATE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)
            echo "Create attempt status: $CREATE_STATUS"
            if [ "$CREATE_STATUS" != "201" ]; then
              echo "Failed to create site. If using an organization with restrictions, use a PAT in PAGES_PAT with repo + pages permissions."
              if [ -z "$PAGES_PAT" ]; then
                echo "No PAGES_PAT provided. Consider creating a PAT and adding it as repo secret PAGES_PAT."
              fi
              exit 1
            else
              echo "Pages site created successfully."
            fi
          else
            echo "Pages site already configured (status $STATUS)."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3
        with:
          enablement: 'enable'
          
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} ./src