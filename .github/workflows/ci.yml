# ...existing code...
name: CI

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - "release"

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install && npm install jest jsdoc --no-save

      - name: Run tests
        run: npm test

  docs:
    name: Generate and Deploy Documentation
    runs-on: ubuntu-latest
    needs: test 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JSDoc
        run: npm install jsdoc --no-save

      - name: Generate Documentation
        run: npm run docs

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
          
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} ./src

  pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: docs
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check current Pages site (debug)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GET /repos/${GITHUB_REPOSITORY}/pages ->"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true
          echo
          echo "HTTP status code above (404 means no site configured)."

      - name: Try to create Pages site (if not exists)
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ajusta branch/path según tu repo; esta llamada crea el site con 'release' y path 'docs'
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            -d '{"source":{"branch":"release","path":"docs"}}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3
        with:
          enablement: 'enable'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1